[project]
name = "youtube-subs-opml"
version = "0.1.0"
description = "Generate an OPML file from your YouTube subscriptions."
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "jinja2>=3.1",
    "itsdangerous>=2.1",
    "authlib>=1.3",
    "httpx>=0.27",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10,<4",
    "opentelemetry-distro>=0.66b0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
]
test = [
    "pytest>=8",
]
downloader = [
    "yt-dlp>=2025.1.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "cryptography>=42",
    "opentelemetry-distro>=0.66b0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
]

[project.scripts]
youtube-subs-opml = "youtube_subs_opml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["youtube_subs_opml"]

[dependency-groups]
dev = [
    "google-api-python-client-stubs>=1.37.0",
    "pyrefly>=1.3.1",
    "ruff>=0.16.9",
]

[tool.pyrefly]
project-includes = ["youtube_subs_opml", "tests", "scripts", "alembic"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
    "PERF",   # perflint
    "PT",     # flake8-pytest-style
    "ASYNC",  # flake8-async
    "DTZ",    # flake8-datetimez
    "BLE",    # flake8-blind-except
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
    "EXE",    # flake8-executable
    "FURB",   # refurb
    "RUF",    # ruff-specific rules
]
ignore = [
    "PT018",  # composite assertions read fine and pytest reports them well
]
# Typographic characters used deliberately in UI strings and comments.
allowed-confusables = ["›", "–"]

[tool.ruff.lint.per-file-ignores]
# `test_jellyfin` is a route, not a pytest test.
"youtube_subs_opml/web/routes/settings.py" = ["PT028"]

[tool.ruff.lint.isort]
known-first-party = ["youtube_subs_opml"]
# The repo's alembic/ migrations dir would otherwise shadow the real package.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends"]
