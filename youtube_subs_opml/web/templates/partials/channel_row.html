<tr class="channel-row{% if ch.ignored %} ignored{% endif %}" data-title="{{ ch.title|lower }}">
  <td class="col-select">
    <input type="checkbox" name="channel_ids" value="{{ ch.channel_id }}" onchange="updateSelection()">
  </td>
  <td class="card-title">
    <a href="https://www.youtube.com/channel/{{ ch.channel_id }}" target="_blank" rel="noopener" class="channel-link">{{ ch.title }}</a>
    {% if ch.is_manual %}
    <span class="manual-badge" title="Added manually (not from YouTube subscriptions)">manual</span>
    <button type="button" class="manual-remove" title="Remove this manually-added channel" onclick="removeManualChannel('{{ ch.channel_id }}')">&times;</button>
    {% endif %}
  </td>
  <td class="channel-categories" data-label="Categories">
    {% for cat in ch.categories %}
      <span class="category-chip"
            hx-post="/channels/unassign"
            hx-include="this"
            hx-target="#channel-list"
            hx-swap="innerHTML show:none"
            hx-vals='{"channel_ids": "{{ ch.channel_id }}", "category_id": "{{ cat.id }}"}'>
        {{ cat.name }} <span class="chip-x">&times;</span>
      </span>
    {% endfor %}
    {% if not ch.ignored %}
    <select class="inline-assign"
            name="category_id"
            hx-post="/channels/assign"
            hx-include="this"
            hx-target="#channel-list"
            hx-swap="innerHTML show:none"
            hx-vals='{"channel_ids": "{{ ch.channel_id }}"}'>
      <option value="" disabled selected>+</option>
      {% for cat in categories %}
        {% if cat.id not in ch.assigned_category_ids %}
        <option value="{{ cat.id }}">{{ cat.name }}</option>
        {% endif %}
      {% endfor %}
    </select>
    {% endif %}
  </td>
  <td data-label="Ignored">
    <input type="checkbox"
           {% if ch.ignored %}checked{% endif %}
           hx-post="/channels/ignore"
           hx-include="this"
           hx-target="#channel-list"
           hx-swap="innerHTML show:none"
           hx-vals='{"channel_ids": "{{ ch.channel_id }}", "ignored": "{{ 'false' if ch.ignored else 'true' }}"}'>
  </td>
  <td data-label="Shorts">
    <select class="shorts-select"
            onchange="postChannelUpdate('/channels/include-shorts', {'channel_ids': '{{ ch.channel_id }}', 'include_shorts': this.value})">
      <option value="inherit"{% if ch.include_shorts is none %} selected{% endif %}>Inherit</option>
      <option value="true"{% if ch.include_shorts == true %} selected{% endif %}>Include</option>
      <option value="false"{% if ch.include_shorts == false %} selected{% endif %}>Exclude</option>
    </select>
  </td>
  <td data-label="Live">
    <select class="shorts-select"
            onchange="postChannelUpdate('/channels/include-live', {'channel_ids': '{{ ch.channel_id }}', 'include_live': this.value})">
      <option value="inherit"{% if ch.include_live is none %} selected{% endif %}>Inherit</option>
      <option value="true"{% if ch.include_live == true %} selected{% endif %}>Include</option>
      <option value="false"{% if ch.include_live == false %} selected{% endif %}>Exclude</option>
    </select>
  </td>
  <td data-label="Archive">
    <select class="shorts-select"
            onchange="postChannelUpdate('/channels/archive-pref', {'channel_ids': '{{ ch.channel_id }}', 'field': 'download_enabled', 'value': this.value})">
      <option value="inherit"{% if ch.download_enabled is none %} selected{% endif %}>Inherit</option>
      <option value="true"{% if ch.download_enabled == true %} selected{% endif %}>On</option>
      <option value="false"{% if ch.download_enabled == false %} selected{% endif %}>Off</option>
    </select>
  </td>
  <td data-label="Keep last N">
    <input type="number" min="0" step="1" class="archive-num" placeholder="—"
           value="{{ ch.keep_last_n if ch.keep_last_n is not none else '' }}"
           onchange="postChannelUpdate('/channels/archive-pref', {'channel_ids': '{{ ch.channel_id }}', 'field': 'keep_last_n', 'value': this.value})">
  </td>
  <td data-label="Max minutes">
    <input type="number" min="0" step="1" class="archive-num" placeholder="—"
           value="{{ ch.max_duration_minutes if ch.max_duration_minutes is not none else '' }}"
           onchange="postChannelUpdate('/channels/archive-pref', {'channel_ids': '{{ ch.channel_id }}', 'field': 'max_duration_seconds', 'value': this.value})">
  </td>
  <td data-label="Podcast">
    <select class="shorts-select"
            onchange="postChannelUpdate('/channels/archive-pref', {'channel_ids': '{{ ch.channel_id }}', 'field': 'generate_podcast', 'value': this.value})">
      <option value="inherit"{% if ch.generate_podcast is none %} selected{% endif %}>Inherit</option>
      <option value="true"{% if ch.generate_podcast == true %} selected{% endif %}>On</option>
      <option value="false"{% if ch.generate_podcast == false %} selected{% endif %}>Off</option>
    </select>
  </td>
  <td data-label="Feed link">
    <select class="shorts-select"
            onchange="postChannelUpdate('/channels/archive-pref', {'channel_ids': '{{ ch.channel_id }}', 'field': 'link_target', 'value': this.value})">
      <option value="inherit"{% if ch.link_target is none %} selected{% endif %}>Inherit</option>
      {% for lt in link_targets %}
      <option value="{{ lt }}"{% if ch.link_target == lt %} selected{% endif %}>{{ lt }}</option>
      {% endfor %}
    </select>
  </td>
  <td class="topics" data-label="Topics">
    {% for topic in ch.youtube_topics %}
      <span class="topic">{{ topic }}</span>{% if not loop.last %}, {% endif %}
    {% endfor %}
  </td>
</tr>
