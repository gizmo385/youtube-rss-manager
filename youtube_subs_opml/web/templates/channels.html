{% extends "base.html" %}
{% block title %}Channels — YouTube Subs OPML{% endblock %}

{% block body %}
<div class="stage">
  <div class="split">
    <section class="list-pane">
      <div class="list-head">
        <div class="list-search-row">
          <input type="search" id="channel-search" placeholder="Search {{ total }} channels…"
                 oninput="filterChannels(this.value)">
          <button type="button" class="btn-primary" onclick="document.getElementById('add-row').classList.toggle('hidden')">+ Add</button>
        </div>
        <div id="add-row" class="list-search-row hidden">
          <input type="text" id="add-channel-input" placeholder="URL, @handle, or UC…"
                 onkeydown="if(event.key==='Enter'){event.preventDefault();addManualChannel();}">
          <button type="button" class="btn" onclick="addManualChannel()">Add</button>
        </div>
        <div class="list-filters">
          {% for f in filters %}
          <button type="button" class="chip-btn{% if f == active_filter %} on{% endif %}"
                  data-filter="{{ f }}" onclick="setFilter('{{ f }}', this)">{{ f }}</button>
          {% endfor %}
        </div>
      </div>
      <div id="add-error" class="add-error hidden" role="alert"></div>

      <div id="channel-groups" class="list-scroll sb">
        {% include "partials/channel_list.html" %}
      </div>

      <div id="bulk-bar" class="bulk-bar hidden">
        <span class="bulk-count" id="bulk-count">0 selected</span>
        <div class="bulk-actions">
          <button type="button" class="btn btn-sm" onclick="togglePicker('assign')">Add to category…</button>
          <button type="button" class="btn btn-sm btn-ghost" onclick="togglePicker('unassign')">Remove from…</button>
          <button type="button" class="btn btn-sm btn-ghost" onclick="clearSelection()">Clear</button>
          <div id="picker-assign" class="bulk-picker hidden"></div>
          <div id="picker-unassign" class="bulk-picker hidden"></div>
        </div>
      </div>
    </section>

    <section id="channel-detail" class="detail-pane sb">
      {% include "partials/channel_detail.html" %}
    </section>
  </div>
</div>

{# Category options for the bulk pickers. #}
<script id="category-data" type="application/json">
  [{% for c in categories %}{"id": {{ c.id }}, "name": {{ c.name|tojson }}}{{ ',' if not loop.last }}{% endfor %}]
</script>

<script>
var currentFilter = {{ active_filter|tojson }};

function selectRow(el) {
  document.querySelectorAll('.chan-row.selected').forEach(function(r){ r.classList.remove('selected'); });
  el.classList.add('selected');
}

function toggleCheck(event, box) {
  event.stopPropagation();
  box.classList.toggle('on');
  box.textContent = box.classList.contains('on') ? '✕' : '';
  updateBulk();
}

function selectedIds() {
  return Array.from(document.querySelectorAll('.chan-check.on')).map(function(b){ return b.getAttribute('data-id'); });
}

function updateBulk() {
  var ids = selectedIds();
  var bar = document.getElementById('bulk-bar');
  document.getElementById('bulk-count').textContent = ids.length + ' selected';
  bar.classList.toggle('hidden', ids.length === 0);
  if (!ids.length) closePickers();
}

function clearSelection() {
  document.querySelectorAll('.chan-check.on').forEach(function(b){ b.classList.remove('on'); b.textContent=''; });
  updateBulk();
}

function closePickers() {
  document.querySelectorAll('.bulk-picker').forEach(function(p){ p.classList.add('hidden'); });
}

function togglePicker(type) {
  var picker = document.getElementById('picker-' + type);
  var other = document.getElementById('picker-' + (type === 'assign' ? 'unassign' : 'assign'));
  other.classList.add('hidden');
  var cats = JSON.parse(document.getElementById('category-data').textContent);
  picker.innerHTML = '';
  cats.forEach(function(c) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn btn-sm' + (type === 'unassign' ? ' btn-ghost' : '');
    btn.textContent = c.name;
    btn.onclick = function(){ bulkAction(type, c.id); };
    picker.appendChild(btn);
  });
  picker.classList.toggle('hidden');
}

function postForm(url, params, cb) {
  var fd = new FormData();
  Object.keys(params).forEach(function(k){
    if (Array.isArray(params[k])) params[k].forEach(function(v){ fd.append(k, v); });
    else fd.append(k, params[k]);
  });
  fetch(url, {method:'POST', body:fd, headers:{'HX-Request':'true'}})
    .then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error(parseErr(t)); }); return r.text(); })
    .then(function(html){ swapGroups(html); if (cb) cb(); })
    .catch(function(e){ showAddError(e.message); });
}

function parseErr(text) {
  try { return JSON.parse(text).detail || text; } catch(e){ return text || 'Request failed'; }
}

function swapGroups(html) {
  var g = document.getElementById('channel-groups');
  g.innerHTML = html;
  htmx.process(g);
  reapplySearch();
}

function bulkAction(type, categoryId) {
  var ids = selectedIds();
  if (!ids.length) return;
  var url = type === 'assign' ? '/channels/assign' : '/channels/unassign';
  postForm(url, {channel_ids: ids, category_id: categoryId, filter: currentFilter}, function(){
    closePickers();
  });
}

function setFilter(name, btn) {
  currentFilter = name;
  document.querySelectorAll('.list-filters .chip-btn').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  htmx.ajax('GET', '/channels/list?filter=' + encodeURIComponent(name), {target:'#channel-groups', swap:'innerHTML'})
    .then(reapplySearch);
}

function filterChannels(query) {
  var q = query.toLowerCase();
  document.querySelectorAll('.chan-row').forEach(function(row){
    var t = row.getAttribute('data-title') || '';
    row.style.display = t.includes(q) ? '' : 'none';
  });
}
function reapplySearch() {
  var s = document.getElementById('channel-search');
  if (s && s.value) filterChannels(s.value);
}

function showAddError(msg) {
  var box = document.getElementById('add-error');
  box.textContent = msg;
  box.classList.remove('hidden');
}

function addManualChannel() {
  var input = document.getElementById('add-channel-input');
  var value = input.value.trim();
  document.getElementById('add-error').classList.add('hidden');
  if (!value) return;
  postForm('/channels/add', {channel_input: value, filter: currentFilter}, function(){ input.value = ''; });
}

function removeManualChannel(channelId) {
  if (!confirm('Remove this manually-added channel?')) return;
  postForm('/channels/remove', {channel_id: channelId, filter: currentFilter});
}

// Keep the detail pane's hidden filter field in sync so its writes group correctly.
document.body.addEventListener('htmx:afterSwap', function(evt){
  if (evt.detail.target.id === 'channel-detail') {
    var f = evt.detail.target.querySelector('[data-detail-filter]');
    if (f) f.value = currentFilter;
  }
  if (evt.detail.target.id === 'channel-groups') reapplySearch();
});
</script>
{% endblock %}
