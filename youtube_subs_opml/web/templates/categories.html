{% extends "base.html" %}
{% block title %}Categories — {{ app_name(user) }}{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <div class="eyebrow">Organisation</div>
    <h1 class="page-title">Categories</h1>
  </div>
  <form class="page-head-actions" hx-post="/categories" hx-target="#category-list" hx-swap="innerHTML"
        hx-on::after-request="if(event.detail.successful) this.reset()">
    <input type="text" name="name" placeholder="New category name" required>
    <button type="submit" class="btn btn-primary">Create</button>
  </form>
</div>

<div id="category-list">
  {% include "partials/category_list.html" %}
</div>
{# Filled by a delete's response (see the end of category_list.html). #}
<div id="cat-undo" aria-live="polite"></div>

<script>
// The Undo offered after a delete: shown for a while, then gone. Restoring
// or dismissing clears it at once.
var UNDO_MS = 12000, catUndoT;
function catUndoClear() {
  clearTimeout(catUndoT);
  document.getElementById('cat-undo').innerHTML = '';
}
document.body.addEventListener('htmx:oobAfterSwap', function (e) {
  if (e.detail.target.id !== 'cat-undo') return;
  clearTimeout(catUndoT);
  catUndoT = setTimeout(catUndoClear, UNDO_MS);
});
document.body.addEventListener('htmx:afterRequest', function (e) {
  var elt = e.detail.requestConfig && e.detail.requestConfig.elt;
  if (!elt || !elt.closest || !elt.closest('#cat-undo')) return;
  catUndoClear();
  if (e.detail.successful) return;
  document.getElementById('cat-undo').innerHTML = '<div class="toast" role="alert"><div>' +
    '<div class="toast-text">Couldn\u2019t restore the category</div>' +
    '<div class="toast-sub">One with that name may already exist</div></div></div>';
  catUndoT = setTimeout(catUndoClear, 6000);
});

// Saving a setting re-renders the whole list, so which panels are open is kept
// here and put back after each swap; otherwise the editor would close under
// the cursor on every change.
var catOpen = {};   // category id -> {settings: true, ...}
var catPanelIds = {settings: 'cat-settings-', rename: 'cat-rename-', detail: 'cat-detail-row-'};

function catPanel(id, name, show) {
  var el = document.getElementById(catPanelIds[name] + id);
  if (!el) return;
  if (show === undefined) show = el.classList.contains('hidden');
  el.classList.toggle('hidden', !show);
  (catOpen[id] = catOpen[id] || {})[name] = show;
  var btn = document.querySelector('[aria-controls="' + el.id + '"]');
  if (btn) btn.setAttribute('aria-expanded', show ? 'true' : 'false');
  if (show && name === 'rename') el.querySelector('input').select();
}

// afterSettle, not afterSwap: htmx carries the old elements' attributes over
// until it settles, which would hide the panel again.
document.body.addEventListener('htmx:afterSettle', function (e) {
  if (e.target.id !== 'category-list') return;
  var focus = window._catFocus;
  Object.keys(catOpen).forEach(function (id) {
    // The picker's contents aren't in the re-rendered list, and a rename
    // that just saved is finished: only the settings editor reopens.
    catOpen[id] = {settings: catOpen[id].settings};
    if (catOpen[id].settings) catPanel(id, 'settings', true);
  });
  if (focus) { var f = document.getElementById(focus); if (f) f.focus(); }
});
// Keep the keyboard where it was across the re-render.
document.body.addEventListener('htmx:beforeRequest', function (e) {
  window._catFocus = e.target && e.target.closest && e.target.closest('.cat-panel') ? e.target.id : null;
});
// One menu open at a time, and a click elsewhere closes it.
document.addEventListener('click', function (e) {
  document.querySelectorAll('.cat-menu[open]').forEach(function (d) {
    if (!d.contains(e.target)) d.open = false;
  });
});
</script>
{% endblock %}
