name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true

      # Ruff needs no project dependencies, just the pinned dev tools.
      - run: uv sync --locked --only-dev

      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .

      - name: ruff format
        run: uv run --no-sync ruff format --check --diff .

  pyrefly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true

      # Type checking resolves imports, so install every extra the code uses.
      - run: uv sync --locked --all-extras

      - name: pyrefly check
        run: uv run --no-sync pyrefly check --output-format full-text-with-github

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --locked --all-extras

      - name: pytest
        run: uv run --no-sync pytest
